<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сводная схема ОВК</title>
<style>
:root{--W:#9a6b00;--bg:#f4f5f3;--fg:#1c2320;--mut:#5f6b65;--ln:#d6dbd7;--card:#fff;--ac:#1f6f5c;--halo:#f4f5f3;
--S:#1d5fd1;--E:#a5531f;--AS:#0b8f8a;--AR:#7a4fc0;--F:#d23c3c;--D:#4f7896;--wall:#2b312e;--eq:#b6bdb8;--coll:#0b9a3e;--hole:#c2185b;--sel:#f2b705}
@media (prefers-color-scheme:dark){:root{--W:#e0b23c;--bg:#151a18;--fg:#e7ece9;--mut:#9aa69f;--ln:#2c3530;--card:#1c2320;--ac:#55bfa2;--halo:#151a18;
--S:#6aa2ff;--E:#e59a63;--AS:#3fc9c2;--AR:#b08cf0;--F:#ff7070;--D:#89b0cc;--wall:#b9c3be;--eq:#55605a;--coll:#3fd47a;--hole:#ff6fa6;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
button,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:5px 10px;min-height:34px}
button{cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#q{width:170px}
#sys{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}
#sys button{white-space:nowrap;display:flex;align-items:center;gap:6px;padding:4px 10px}
#sys button i{display:inline-block;width:16px;height:4px;border-radius:2px}
#sys button.off{opacity:.45}
#sys button.off i{background:var(--mut)!important}
.sp{flex:1}
#wrap{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;min-width:0;position:relative;touch-action:none;overflow:hidden}
svg{width:100%;height:100%;display:block;background:var(--bg);user-select:none;-webkit-user-select:none}
#side{width:380px;border-left:1px solid var(--ln);background:var(--card);overflow:auto}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--card);z-index:2}
.tabs button{flex:1 0 auto;border:0;border-radius:0;background:none;border-bottom:2px solid transparent;padding:9px 5px;font-size:12.5px}
.tabs button.on{background:none;color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.card{padding:10px 14px}
.card h3{margin:2px 0;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--mut);margin-bottom:8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
dt{color:var(--mut)}dd{margin:0;font-variant-numeric:tabular-nums}
h4{margin:14px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
tr.r{cursor:pointer}tr.r:hover,tr.r.sel{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-weight:700;color:#fff;font-size:13px}
.warn{background:color-mix(in srgb,var(--F) 12%,transparent);border-left:3px solid var(--F);padding:6px 8px;margin:8px 0;font-size:13px}
.note{color:var(--mut);font-size:13px;margin:8px 0}
.card a,.lnk{color:var(--ac);font-weight:600;cursor:pointer;text-decoration:none}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:8px;padding:6px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.steps li.cur{background:color-mix(in srgb,var(--sel) 22%,transparent)}
.steps b{min-width:46px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chk{display:flex;gap:6px;align-items:center;min-height:30px}
.chk input{width:20px;height:20px;min-height:0}
#tip{position:absolute;z-index:8;pointer-events:none;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:13px;display:none;max-width:260px}
#tip b{font-size:14px}
#menu{position:absolute;left:8px;top:8px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;z-index:9;display:none;max-height:calc(100% - 16px);overflow:auto;min-width:230px}
#menu.open{display:block}
#menu label{display:flex;gap:8px;align-items:center;padding:4px 0;min-height:30px}
#menu input{width:18px;height:18px;min-height:0}
#zones{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;z-index:4}
#zones button{opacity:.95;font-size:13px}
#ruler{position:absolute;left:50%;transform:translateX(-50%);top:8px;z-index:6;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;display:none;font-weight:600}
.hint{color:var(--mut);padding:12px 14px}
.face{width:100%;height:auto;background:transparent}
/* svg */
.house{fill:var(--card);stroke:none}
.wall{fill:none;stroke:var(--wall);stroke-width:var(--th)}
.wallf{fill:var(--wall);stroke:var(--wall);stroke-width:var(--th);opacity:.85}
.open{fill:none;stroke:var(--wall);stroke-width:var(--th);opacity:.55}
.eq{fill:none;stroke:var(--eq);stroke-width:var(--th)}
.kq{stroke:var(--mut);stroke-width:var(--th);fill:color-mix(in srgb,var(--mut) 14%,transparent)}
.kq.vent{stroke:var(--S);fill:color-mix(in srgb,var(--S) 16%,transparent)}.kq.hum{stroke:var(--AS);fill:color-mix(in srgb,var(--AS) 22%,transparent)}
.kq.heat{stroke:var(--E);fill:color-mix(in srgb,var(--E) 20%,transparent)}.kq.furn{stroke:var(--mut);fill:color-mix(in srgb,var(--mut) 10%,transparent)}
.ktub{fill:none;stroke:var(--S);opacity:.28;stroke-linejoin:round;pointer-events:none}.ktub.extract,.ktub.hood{stroke:var(--E)}.ktub.flue{stroke:var(--F)}.ktub.vent{stroke:var(--AS)}
.kql{font-size:calc(var(--fs)*.7);fill:var(--fg);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--halo);stroke-width:calc(var(--fs)*.25)}
.ln{fill:none;stroke-linejoin:round;stroke-linecap:butt}
.ln.S{stroke:var(--S);stroke-width:var(--pw)}.ln.E{stroke:var(--E);stroke-width:var(--pw)}
.ln.AS{stroke:var(--AS);stroke-width:var(--aw);opacity:.85}.ln.AR{stroke:var(--AR);stroke-width:var(--aw);opacity:.85}
.ln.F{stroke:var(--F);stroke-width:var(--fw);stroke-dasharray:calc(var(--fw)*4) calc(var(--fw)*2)}
.ln.D{stroke:var(--D);stroke-width:var(--fw);stroke-dasharray:calc(var(--fw)*2) calc(var(--fw)*2)}
.hit{fill:none;stroke:transparent;stroke-width:var(--hw);cursor:pointer;pointer-events:stroke}
#root.dim .ln,#root.dim .el{opacity:.13}
#root.dim .ln.hl,#root.dim .el.hl{opacity:1}
#root.dim .ln.hl2,#root.dim .el.hl2{opacity:.5}
.furn{fill:none;stroke:var(--mut);stroke-width:var(--th);opacity:.55}
#pane.dim .fl{opacity:.22}#pane.dim .fl.hl{opacity:1}#pane.dim .fl.hl2{opacity:.6}.fl{cursor:pointer}
#flinfo{min-height:2.6em;padding:4px 14px;font-size:13px}
.ln.hl{filter:drop-shadow(0 0 calc(var(--th)*2) var(--sel))}
.el{cursor:pointer}
.coll{fill:color-mix(in srgb,var(--coll) 15%,transparent);stroke:var(--coll);stroke-width:var(--th2)}
.term{fill:color-mix(in srgb,var(--E) 16%,var(--bg));stroke:var(--mut);stroke-width:var(--th2)}
.slot{fill:color-mix(in srgb,var(--mut) 30%,transparent);stroke:var(--mut);stroke-width:var(--th2)}
.unit{fill:color-mix(in srgb,var(--AS) 10%,var(--bg));stroke:var(--AS);stroke-width:var(--th2)}
.unitx{stroke:var(--AS);stroke-width:var(--th);fill:none;pointer-events:none}
.hatch{fill:none;stroke:var(--mut);stroke-width:var(--th);stroke-dasharray:calc(var(--th)*6) calc(var(--th)*4);pointer-events:none}
.nb{fill:color-mix(in srgb,var(--F) 10%,transparent);stroke:var(--F);stroke-width:var(--th2);stroke-dasharray:calc(var(--th)*6) calc(var(--th)*3)}
.inst{fill:none;stroke:var(--D);stroke-width:var(--th);stroke-dasharray:calc(var(--th)*6) calc(var(--th)*3)}
.flexi{fill:none;stroke:var(--fg);stroke-width:var(--th);opacity:.7}
.acbg{fill:none;stroke:var(--AS);stroke-width:var(--th);opacity:.6}
.hole{fill:none;stroke:var(--hole);stroke-width:var(--th2)}
.hole.f{stroke:var(--F);stroke-dasharray:calc(var(--th)*4) calc(var(--th)*3)}
.v3d{cursor:pointer}
.v3d rect{fill:var(--ac);stroke:var(--card);stroke-width:var(--th)}
.v3d.no rect{fill:var(--mut)}
.v3d text{fill:#fff;font-weight:800;font-size:var(--fs);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.axis{stroke:var(--mut);stroke-width:var(--th);stroke-dasharray:calc(var(--th)*20) calc(var(--th)*10);opacity:.45}
.room{font-size:calc(var(--fs)*.95);fill:var(--mut);text-anchor:middle;pointer-events:none;opacity:.9}
.room .rn{font-weight:700}
.lbl{font-size:var(--fs);fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:calc(var(--fs)*.3);stroke-linejoin:round;pointer-events:none;font-weight:600}
.lbl.g{fill:var(--mut);font-weight:500}.lbl.c{fill:var(--coll)}.lbl.h{fill:var(--hole)}
.geo{font-weight:700;fill:var(--coll);paint-order:stroke;stroke:var(--halo);stroke-width:12px;pointer-events:none}
.rl{fill:var(--fg);font-size:var(--fs);font-weight:700;paint-order:stroke;stroke:var(--sel);stroke-width:calc(var(--fs)*.45);stroke-linejoin:round;pointer-events:none}
.gap{stroke:var(--fg);stroke-width:var(--th);fill:none;marker-start:url(#ar);marker-end:url(#ar)}
.gl{fill:var(--fg);font-size:calc(var(--fs)*.92);paint-order:stroke;stroke:var(--halo);stroke-width:calc(var(--fs)*.3);pointer-events:none}
.stepdot{fill:var(--sel);stroke:var(--fg);stroke-width:var(--th)}
.rul{stroke:var(--sel);stroke-width:calc(var(--th)*2.5);fill:none}
.ruld{fill:var(--sel);stroke:var(--fg);stroke-width:var(--th)}
@media (max-width:760px){
 h1{display:none}header{padding:5px 8px;gap:5px}header button{padding:4px 8px}#sys{padding:5px 8px}
 #wrap{flex-direction:column}
 #side{width:100%;height:40%;border-left:0;border-top:1px solid var(--ln)}
 h1{font-size:14px}
 #q{flex:1;width:auto;min-width:120px}
 #zones{flex-direction:row;left:8px;right:8px;bottom:6px;overflow-x:auto}
 #zones button{white-space:nowrap;min-height:30px;padding:3px 9px;font-size:12px}
}
#print{display:none;--W:#9a6b00;--bg:#fff;--fg:#1c2320;--mut:#5f6b65;--ln:#d6dbd7;--card:#fff;--halo:#fff;--S:#1d5fd1;--E:#a5531f;--AS:#0b8f8a;--AR:#7a4fc0;--F:#d23c3c;--D:#4f7896;--wall:#2b312e;--eq:#b6bdb8;--coll:#0b9a3e;--hole:#c2185b}
#sheet{display:none;position:absolute;right:10px;top:10px;z-index:30;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px;width:300px;box-shadow:0 4px 18px #0003}
#sheet label{display:block;margin:6px 0}#sheet select,#sheet input{width:100%;margin-top:2px;font:inherit;padding:4px}
#bsave{display:none;font-weight:700;background:var(--ac);color:#fff;border-color:var(--ac)}#bsave.dirty{background:var(--F);border-color:var(--F)}
body.edit #bsave,body.hasops #bsave{display:inline-block}
#sstat{display:none;font-size:12.5px;padding:4px 9px;border-radius:12px;cursor:pointer;white-space:nowrap;font-weight:600}
body.edit #sstat,body.hasops #sstat{display:inline-block}
#sstat.ok{background:color-mix(in srgb,var(--coll) 18%,transparent);color:var(--coll)}#sstat.wait{background:color-mix(in srgb,var(--sel) 30%,transparent)}
#sstat.bad{background:var(--F);color:#fff}#sstat.warn{background:color-mix(in srgb,var(--sel) 45%,transparent)}
#dlg{display:none;position:fixed;inset:0;z-index:50;background:#0007;align-items:center;justify-content:center;padding:16px}
#dlg.show{display:flex}#dlg>div{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px 18px;max-width:560px;width:100%;max-height:90%;overflow:auto;box-shadow:0 8px 30px #0006}
#dlg h3{margin:0 0 8px;font-size:17px}#dlg textarea{width:100%;height:150px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:6px}
#dlg .big{font-size:15px;font-weight:700;margin:6px 0}#dlg .big.ok{color:var(--coll)}#dlg .big.bad{color:var(--F)}
body.edit #bed{background:var(--F);color:#fff;border-color:var(--F)}
.ed h3{color:var(--F)}
body.client .row:has(.chk),body.client [data-bn],body.client #belec,body.client .card:has(#phin),body.client .card:has(.sub+.row #phin){display:none!important}
.pult{fill:color-mix(in srgb,var(--W) 25%,var(--bg));stroke:var(--W);stroke-width:var(--th2)}
.ln.W{stroke:var(--W);stroke-width:var(--fw);stroke-dasharray:calc(var(--fw)*1) calc(var(--fw)*1.5)}
.furn.prev{stroke:var(--F);stroke-dasharray:calc(var(--th)*5) calc(var(--th)*3);opacity:.8}.furn.cur{stroke:var(--fg);opacity:1}
.segh{fill:var(--sel);stroke:var(--fg);stroke-width:var(--th);cursor:grab}
.corh{fill:var(--ac);stroke:var(--halo);stroke-width:var(--th);cursor:move;opacity:.92}.corh.on{fill:var(--F);opacity:1}
.cort{fill:#fff;font-weight:700;text-anchor:middle;pointer-events:none}.ptm{fill:var(--F);stroke:#fff;stroke-width:var(--th);pointer-events:none}
.selb{border-left:3px solid var(--F);padding:4px 0 4px 10px;margin:10px 0}details summary{cursor:pointer;margin:10px 0;color:var(--mut)}
.fo{fill:var(--mut);fill-opacity:.16;stroke:var(--mut);stroke-width:var(--th);stroke-opacity:.8}.fo.island{fill-opacity:.1}.fo.hl{fill:var(--sel);fill-opacity:.35;stroke:var(--sel)}
body.edit .fo{cursor:move;stroke:var(--F);stroke-width:calc(var(--th2)*1.4)}
body.edit .term,body.edit .slot,body.edit .unit,body.edit .pult{cursor:move}
body.edit .term,body.edit .slot,body.edit .pult{stroke:var(--F);stroke-width:calc(var(--th2)*1.4)}.segm{stroke:var(--sel);stroke-width:calc(var(--pw)*2);opacity:.6}
@media print{body>*:not(#print){display:none!important}#print{display:block;padding:10mm;color:#000;background:#fff}
 #print.sheet{padding:0}#print .sh{position:relative;overflow:hidden;page-break-after:avoid}#print .fr{position:absolute;border:.5mm solid #000}
 #print .tb{position:absolute;border-collapse:collapse;background:#fff;font-size:9pt}#print .tb td{border:.3mm solid #000;padding:1mm 2mm}
 #print table{font-size:11pt}#print td,#print th{border:1px solid #999;padding:4px 6px}body{overflow:visible;display:block;height:auto}}
</style>
</head>
<body>
<header>

 <button id="bsheet">Печать / PDF</button>

</header>
<div id="sys"></div>
<div id="wrap">
 <div id="map">

</div>

function opCham(p,i,j,c,line){const r=collapse(p,i,j),P=r.p,k=r.k,C=P[k],a=P[k-1],b=P[k+1],d1=un(sub(C,a)),d2=un(sub(b,C));let A,B;

function doCham(l,co,c){const r0=opCham(l.pts,co.i,co.j,c,null);if(!r0)return null;
