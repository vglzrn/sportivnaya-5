<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>План Ø90, интерактивный</title>
<style>
:root{--bg:#f4f5f3;--fg:#1c2320;--mut:#5f6b65;--ln:#d6dbd7;--card:#fff;--ac:#1f6f5c;--sup:#1d5fd1;--exh:#a5531f;--wall:#2b312e;--ac160:#9aa39e;--eq:#b6bdb8;--coll:#0b9a3e;--hole:#c2185b;--halo:#f4f5f3}
@media (prefers-color-scheme:dark){:root{--bg:#151a18;--fg:#e7ece9;--mut:#9aa69f;--ln:#2c3530;--card:#1c2320;--ac:#55bfa2;--sup:#6aa2ff;--exh:#e59a63;--wall:#b9c3be;--ac160:#5d6762;--eq:#55605a;--coll:#3fd47a;--hole:#ff6fa6;--halo:#151a18;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
h1{font-size:15px;margin:0 8px 0 0}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;min-height:34px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sp{flex:1}
#wrap{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;min-width:0;position:relative;touch-action:none}
svg{width:100%;height:100%;display:block;background:var(--bg);user-select:none;-webkit-user-select:none}
#side{width:360px;border-left:1px solid var(--ln);background:var(--card);overflow:auto;padding:0 0 16px}
#side h2{font-size:13px;margin:14px 14px 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.tabs{display:flex;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--card);z-index:2}
.tabs button{flex:1;border:0;border-radius:0;background:none;border-bottom:2px solid transparent;padding:10px}
.tabs button.on{background:none;color:var(--ac);border-bottom-color:var(--ac)}
.card{padding:8px 14px}
.card h3{margin:6px 0 2px;font-size:18px}
.card .sub{color:var(--mut);margin-bottom:8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
dt{color:var(--mut)}dd{margin:0;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:600;font-size:12px}
tr.r{cursor:pointer}tr.r:hover,tr.r.sel{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-weight:600;color:#fff}
.chip.S{background:var(--sup)}.chip.E{background:var(--exh)}
#layers{position:absolute;left:8px;top:8px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;z-index:5;display:none;max-height:calc(100% - 16px);overflow:auto}
#layers.open{display:block}
#layers label{display:flex;gap:8px;align-items:center;padding:5px 0;min-height:30px}
#layers input{width:18px;height:18px}
#layers hr{border:0;border-top:1px solid var(--ln);margin:6px 0}
#zones{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;z-index:4}
#zones button{background:var(--card);opacity:.95}
.card a{color:var(--ac);font-weight:600}
.hint{color:var(--mut);padding:10px 14px}
/* svg */
.wall{fill:none;stroke:var(--wall);stroke-width:var(--wk)}
.open{fill:none;stroke:var(--wall);stroke-width:var(--th);opacity:.6}
.ac{fill:none;stroke:var(--ac160);stroke-width:var(--th)}
.acs{fill:color-mix(in srgb,var(--ac160) 25%,transparent);stroke:var(--ac160);stroke-width:var(--th)}
.eq{fill:none;stroke:var(--eq);stroke-width:var(--th)}
.pipe{fill:none;stroke-linejoin:round;stroke-linecap:butt;stroke-width:var(--pw);cursor:pointer}
.pipe.S{stroke:var(--sup)}.pipe.E{stroke:var(--exh)}
.hit{fill:none;stroke:transparent;stroke-width:var(--hw);cursor:pointer;pointer-events:stroke}
.dim .pipe,.dim .term,.dim .hole{opacity:.12}
.pipe.sel{stroke-width:calc(var(--pw)*1.8);opacity:1!important}
.term.sel,.hole.sel,.coll.sel{opacity:1!important}
.lbl{font-size:var(--fs);fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:calc(var(--fs)*.28);stroke-linejoin:round;pointer-events:none;font-weight:600}
.lbl.S{fill:var(--sup)}.lbl.E{fill:var(--exh)}.lbl.h{fill:var(--hole)}.lbl.g{fill:var(--mut);font-weight:500}.lbl.c{fill:var(--coll)}
.geo{font-weight:600;fill:var(--coll);paint-order:stroke;stroke:var(--halo);stroke-width:12px;pointer-events:none}
.coll{fill:color-mix(in srgb,var(--coll) 15%,transparent);stroke:var(--coll);stroke-width:var(--th2);cursor:pointer}
.term{fill:color-mix(in srgb,var(--exh) 16%,var(--bg));stroke:var(--mut);stroke-width:var(--th2);cursor:pointer}
.slot{fill:color-mix(in srgb,var(--ac160) 40%,transparent);stroke:var(--mut);stroke-width:var(--th2);cursor:pointer}
.hole{fill:none;stroke:var(--hole);stroke-width:var(--th2);cursor:pointer}
.hole.f{stroke:var(--mut);stroke-dasharray:60 40}
.axis{stroke:var(--mut);stroke-width:var(--th);stroke-dasharray:240 120;opacity:.5}
.ab{fill:var(--card);stroke:var(--mut);stroke-width:var(--th)}
.room{font-size:var(--fs);fill:var(--mut);text-anchor:middle;pointer-events:none;opacity:.8}
.hide{display:none}
@media (max-width:760px){
 #zones{flex-direction:row;left:8px;right:8px;bottom:6px;overflow-x:auto}#zones button{white-space:nowrap;min-height:30px;padding:3px 9px;font-size:12px}
 #wrap{flex-direction:column}
 #side{width:100%;height:40%;border-left:0;border-top:1px solid var(--ln)}
 h1{width:100%}
}
</style>
</head>

 </aside>

// ===== панель
const pane=$('#pane');let tab='card';
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function anc(a){return `x ${a.x} (${a.dx>=0?'+':''}${a.dx} от оси ${a.ax}), y ${a.y} (${a.dy>=0?'+':''}${a.dy} от оси ${a.ay})`}
function dd(k,v){return v==null||v===''?'':`<dt>${k}</dt><dd>${v}</dd>`}
function pipeCard(p){const t=T[p.dest];const hl=p.hole?D.holes.find(h=>h.n===p.hole):null;
 return `<div class="card"><h3><span class="chip ${p.net}">${p.tag}</span> ${p.net==='S'?'приток':'вытяжка'}</h3><div class="sub">${p.room}</div><dl>
 ${dd('Труба','Flexag Ø90')}
 ${dd('Расход',fm(p.q)+' м³/ч')}
 ${dd('Длина трассы',fm(p.L.toFixed(2))+' м')}
 ${dd('Из них в котельной',fm(p.Lin.toFixed(2))+' м')}
 ${dd('Откуда',`${p.exit.coll}, выход ${p.exit.n} (${p.exit.desc})`)}
 ${dd('Куда',`<a href="#" data-go="t:${t.id}">${t.name}</a><br><small>${anc(t.anc)}</small>`)}
 ${dd('Проходка в перегородке',p.penh?`${p.penh.n}, x ${p.penh.x}, y 8199`:'нет (не через перегородку)')}
 ${dd('Отверстие',p.hole?`<a href="#" data-go="h:${p.hole}">${p.hole}</a>${hl?`<br><small>${anc(hl.anc)}${hl.note?'; '+hl.note:''}</small>`:''}`:(p.ops.length?'':'нет'))}
 ${p.ops.length?dd('Опуск',p.ops.join('<br>')):''}
 ${dd('Проходов стен',p.walls)}
 ${dd('Примечание',p.note)}
 </dl><p><button data-fit="${p.id}">Показать трассу</button></p></div>`}
function termCard(t){const ps=D.pipes.filter(p=>p.dest===t.id);const q=ps.reduce((a,p)=>a+p.q,0);
 return `<div class="card"><h3>${t.name}</h3><div class="sub">${t.kind==='slot'?'Щелевой диффузор Flow AF G2':'Потолочный пленум Flexag'}</div><dl>
 ${dd('Привязка',anc(t.anc))}${dd('Врезок Ø90',ps.length||'нет')}${dd('Трубы',ps.map(p=>`<a href="#" data-go="p:${p.id}">${p.tag}</a>`).join(', '))}${dd('Расход по Ø90',ps.length?fm(q.toFixed(1))+' м³/ч':'')}${dd('Длины',ps.map(p=>p.tag+' '+fm(p.L.toFixed(1))+' м').join(', '))}</dl></div>`}
function collTable(c){const ps=D.pipes.filter(p=>p.exit.coll===c);
 const ord=p=>{const n=p.exit.n;if(/^\d+$/.test(n))return +n;if(n[0]==='Б')return 100+(+n.slice(1));return 200};
 ps.sort((a,b)=>ord(a)-ord(b));
 const q=ps.reduce((a,p)=>a+p.q,0),l=ps.reduce((a,p)=>a+p.L,0);
 return `<div class="card"><h3>${c}</h3><div class="sub">${c==='К-П'?'Приток':'Вытяжка'}, Flexag CMP-FLD 200/90×12. Выходы: ${ps.length} линий, ${fm(q.toFixed(1))} м³/ч, ${fm(l.toFixed(1))} м</div></div>
 <table><tr><th>Вых.</th><th>Тр.</th><th>Куда</th><th>L, м</th><th>q</th><th>Отв.</th></tr>${ps.map(p=>`<tr class="r" data-id="${p.id}"><td>${p.exit.n}</td><td><b>${p.tag}</b></td><td>${T[p.dest].name.replace(/^Пленум /,'пл. ').replace(/^Щель /,'щ. ')}</td><td>${fm(p.L.toFixed(1))}</td><td>${fm(p.q)}</td><td>${p.hole||''}${p.penh?(p.hole?', ':'')+p.penh.n:''}</td></tr>`).join('')}</table>
 <div class="hint">Нумерация выходов: передний ряд с запада на восток; Б — боковые выходы (К-В: Б1, Б2 на западе; К-П: Б1–Б5 на востоке, с юга на север); Т — торцевой выход К-В (север). Q в м³/ч.</div>`}
function allTable(){const ps=D.pipes.slice();
 return `<div class="card"><div class="sub">Приток ${fm(D.sums.lS)} м, ${fm(D.sums.qS)} м³/ч · вытяжка ${fm(D.sums.lE)} м, ${fm(D.sums.qE)} м³/ч · всего Ø90 ${fm((D.sums.lS+D.sums.lE).toFixed(1))} м</div></div>
 <table><tr><th>Тр.</th><th>Помещение</th><th>L, м</th><th>q</th><th>Отв.</th></tr>${ps.map(p=>`<tr class="r" data-id="${p.id}"><td><b>${p.tag}</b></td><td>${p.room}</td><td>${fm(p.L.toFixed(1))}</td><td>${fm(p.q)}</td><td>${p.hole||''}${p.penh?(p.hole?', ':'')+p.penh.n:''}</td></tr>`).join('')}</table>`}
function holeCard(n){const hs=D.holes.filter(h=>h.n===n);const h=hs[0];
 return `<div class="card"><h3>${n}</h3><div class="sub">${h.kind==='Ф'?'Фреон ('+h.note+')':h.kind==='Р'?'Проходка в перегородке':'Отверстие'}</div><dl>${dd('Диаметр',h.d?'Ø'+h.d:'')}${dd('Привязка',anc(h.anc))}${dd('Трубы',h.tags.map(t=>`<a href="#" data-go="p:${t}">${t}</a>`).join(', '))}${dd('Примечание',h.kind==='Ф'?'':h.note)}</dl></div>`}
function render(){
 const s=st.sel;let h='';
 if(tab==='card'){if(!s)h='<div class="hint">Нажмите на трубу, коллектор, пленум, щель или отверстие, чтобы увидеть данные. Выбранная трасса подсвечивается.<br><br>Подписи на плане настраиваются в «Слои».</div>';
  else if(s.k==='p')h=pipeCard(P[s.id]);else if(s.k==='t')h=termCard(T[s.id]);else if(s.k==='c')h=collTable(s.id);else if(s.k==='h')h=holeCard(s.id)}
 else if(tab==='all')h=allTable();else h=collTable(tab.replace('K-','К-'));
 pane.innerHTML=h;
 pane.querySelectorAll('tr.r').forEach(r=>r.onclick=()=>{pick('p',r.dataset.id,true)});
 pane.querySelectorAll('[data-go]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const [k,id]=a.dataset.go.split(':');pick(k,id,true)});
 pane.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>fitPipe(b.dataset.fit));
 apply()}
function fitPipe(id){const p=P[id];const xs=p.pts.map(a=>a[0]),ys=p.pts.map(a=>a[1]);fit([Math.min(...xs)-300,Math.min(...ys)-300,Math.max(...xs)+300,Math.max(...ys)+300],0.12)}
function pick(k,id,go){st.sel=k?{k,id}:null;if(k&&tab!=='card'&&k!=='p')tab='card';if(k&&tab==='card')document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='card'));
 if(k&&tab!=='card'&&k==='p'){/* остаёмся в таблице */}
 else if(k)setTab('card');else render();
 if(go&&k==='p')fitPipe(id)}
// ===== слои UI
const LAY=[['S','Приток Ø90 (П)'],['E','Вытяжка Ø90 (В)'],['coll','Коллекторы К-П, К-В'],['term','Диффузоры и пленумы'],['hole','Отверстия и проходки'],['wall','Стены'],['axis','Оси'],['ac','Кондиционирование Ø160 (фон)'],['eq','Оборудование котельной (фон)']];
const LAB=[['tag','Номера труб'],['len','Длины, м'],['q','Расход, м³/ч'],['hole','Номера отверстий'],['bind','Привязки отверстий к осям']];
const lp=$('#layers');
lp.innerHTML='<b>Слои</b>'+LAY.map(([k,n])=>`<label><input type="checkbox" data-l="${k}" ${st.layers[k]?'checked':''}>${n}</label>`).join('')+'<hr><b>Подписи</b>'+LAB.map(([k,n])=>`<label><input type="checkbox" data-b="${k}" ${st.lab[k]?'checked':''}>${n}</label>`).join('');
lp.querySelectorAll('[data-l]').forEach(i=>i.onchange=()=>{st.layers[i.dataset.l]=i.checked?1:0;save();rebuildLabels()});
lp.querySelectorAll('[data-b]').forEach(i=>i.onchange=()=>{st.lab[i.dataset.b]=i.checked?1:0;save();rebuildLabels();setView()});
$('#bl').onclick=()=>lp.classList.toggle('open');
$('#bfit').onclick=()=>fit(D.zones[0].rect);
const zn=$('#zones');D.zones.slice(1).forEach(z=>{const bb=document.createElement('button');bb.textContent=z.name;bb.onclick=()=>fit(z.rect,0.05);zn.appendChild(bb)});
$('#stat').textContent=`приток ${D.pipes.filter(p=>p.net==='S').length} лин., вытяжка ${D.pipes.filter(p=>p.net==='E').length} лин.`;
addEventListener('resize',()=>setView());
fit(D.zones[0].rect,0.02);rebuildLabels();setView();render();
</script>
</body>
</html>
